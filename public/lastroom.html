<html>
  <head>
    <meta charset="UTF-8">
    <title>The Last Room — VR</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <!-- The story texts, the sound engine, the building blocks and the story flow -->
    <script src="lastroom/story.js"></script>
    <script src="lastroom/audio.js"></script>
    <script src="lastroom/components.js"></script>
    <script src="lastroom/controller.js"></script>
  </head>
  <body>
    <a-scene last-room
             background="color: #0d0c0a"
             renderer="antialias: true"
             loading-screen="dotsColor: #c9973a; backgroundColor: #0d0c0a"
             cursor="rayOrigin: mouse"
             raycaster="objects: .interactive">

      <!-- ================================================================
           YOU: head and two controllers. Point + trigger to interact.
           ================================================================ -->
      <a-entity id="rig">
        <a-entity camera look-controls audio-listener position="0 1.6 0"></a-entity>
        <a-entity laser-controls="hand: left" raycaster="objects: .interactive; far: 30; lineColor: #e8c870; lineOpacity: 0.7"></a-entity>
        <a-entity laser-controls="hand: right" raycaster="objects: .interactive; far: 30; lineColor: #e8c870; lineOpacity: 0.7"></a-entity>
      </a-entity>

      <!-- ================================================================
           FLOATING TEXT PANELS (drawn and placed by lastroom/controller.js)
           ================================================================ -->
      <a-entity id="ui-title" canvas-panel="width: 1.8; height: 1.8"></a-entity>
      <a-entity id="ui-enter" canvas-panel="width: 0.7; height: 0.16; resolution: 512" vr-button="label: Enter the House"></a-entity>
      <a-entity id="ui-header" canvas-panel="width: 1.6; height: 1.0"></a-entity>
      <a-entity id="ui-label" canvas-panel="width: 0.5; height: 0.375; resolution: 512"></a-entity>
      <a-entity id="ui-memory" canvas-panel="width: 1.8; height: 1.125"></a-entity>
      <a-entity id="ui-letter" canvas-panel="width: 1.0; height: 1.3"></a-entity>
      <a-entity id="ui-continue" canvas-panel="width: 0.62; height: 0.16; resolution: 512" vr-button="label: Continue →"></a-entity>
      <a-entity id="ui-step" canvas-panel="width: 0.62; height: 0.16; resolution: 512" vr-button="label: Step Away →"></a-entity>
      <a-entity id="ui-end" canvas-panel="width: 1.8; height: 0.9"></a-entity>
      <a-entity id="ui-again" canvas-panel="width: 0.62; height: 0.16; resolution: 512" vr-button="label: Begin Again"></a-entity>

      <!-- Objects with class="reactive" react to the story:
           memory-fx animates them when the memory unlocks, memory-figure fades in a person. -->

      <!-- ================================================================
           TITLE
           ================================================================ -->
      <a-entity id="scene-intro" visible="false">
        <a-entity drifting-motes="count: 260; size: 10 5 10; color: #c9973a; particleSize: 0.035; speed: 0.05; opacity: 0.8"></a-entity>
      </a-entity>

      <!-- ================================================================
           01 THE DOORSTEP
           ================================================================ -->
      <a-entity id="scene-doorstep" visible="false">
        <a-sky radius="300" sky-gradient="colors: #8aa2b8, #b0c0cc, #d8c6a4, #c4a882, #6b7f6e"></a-sky>
        <a-entity light="type: hemisphere; color: #e6ecf0; groundColor: #4a5c42; intensity: 1.4"></a-entity>
        <a-entity light="type: directional; color: #ffe2b8; intensity: 1.8" position="5 8 4"></a-entity>
        <a-entity light="type: point; color: #ffb866; intensity: 2; distance: 6; decay: 1.5" position="0 1.6 -6.2"></a-entity>

        <a-circle radius="60" rotation="-90 0 0" color="#4f6246" roughness="1"></a-circle>
        <a-entity grass-tufts="count: 1500; width: 28; depth: 26; color: #4a6b3a; exclude: -0.8 -5.3 0.8 1.5, -3.8 -11.5 3.8 -4.8"></a-entity>

        <!-- The house, its front door (the trigger) opens inwards -->
        <a-entity cottage="mode: day" position="0 0 -5"></a-entity>
        <a-entity class="reactive" position="-0.55 0 -5.03" rotation="0 20 0"
                  hold-to-activate="hitSize: 1.4 2.4 0.8; hitOffset: 0.55 1.1 0.2; glowRadius: 0.7"
                  memory-fx="property: rotation; to: 0 100 0; dur: 1700; easing: easeInOutQuad">
          <a-box position="0.55 1.05 0" width="1.1" height="2.1" depth="0.06" color="#4a3028" roughness="0.8"></a-box>
          <a-box position="0.55 1.25 0.035" width="0.75" height="0.6" depth="0.01" color="#3d2b1f"></a-box>
          <a-box position="0.55 0.55 0.035" width="0.75" height="0.6" depth="0.01" color="#3d2b1f"></a-box>
          <a-sphere position="0.95 1.0 0.06" radius="0.035" color="#c9973a" metalness="0.6" roughness="0.3"></a-sphere>
        </a-entity>

        <!-- FOR SALE sign -->
        <a-entity position="3.2 0 -3.1" rotation="0 -25 0">
          <a-cylinder radius="0.04" height="1.6" position="0 0.8 0" color="#5c4033"></a-cylinder>
          <a-box width="0.94" height="0.58" depth="0.03" position="0 1.35 0.02" color="#d4431a"></a-box>
          <a-entity sign="text: FOR SALE; width: 0.9; height: 0.55; color: #ffffff; background: #d4431a; style: 700; size: 0.26" position="0 1.35 0.04"></a-entity>
        </a-entity>

        <!-- Stepping stones up to the door -->
        <a-box position="0.05 0.02 -0.8" rotation="0 4 0" width="0.9" height="0.05" depth="0.5" color="#9a8a72"></a-box>
        <a-box position="-0.08 0.02 -1.5" rotation="0 -6 0" width="0.85" height="0.05" depth="0.5" color="#948470"></a-box>
        <a-box position="0.06 0.02 -2.2" rotation="0 3 0" width="0.9" height="0.05" depth="0.5" color="#9a8a72"></a-box>
        <a-box position="-0.04 0.02 -2.9" rotation="0 -4 0" width="0.88" height="0.05" depth="0.5" color="#8f806c"></a-box>
        <a-box position="0.03 0.02 -3.6" rotation="0 5 0" width="0.9" height="0.05" depth="0.5" color="#9a8a72"></a-box>
        <a-box position="0 0.02 -4.25" rotation="0 -2 0" width="0.9" height="0.05" depth="0.45" color="#948470"></a-box>

        <!-- Overgrown garden -->
        <a-icosahedron radius="0.8" position="-2.6 0.45 -4.1" scale="1.3 0.9 1" color="#3f5a35" material="flatShading: true; roughness: 1"></a-icosahedron>
        <a-icosahedron radius="0.7" position="2.4 0.4 -4.3" scale="1.2 0.9 1.1" color="#4a6b3a" material="flatShading: true; roughness: 1"></a-icosahedron>
        <a-icosahedron radius="0.9" position="-4.4 0.55 -2.3" scale="1 0.8 1.2" color="#34502c" material="flatShading: true; roughness: 1"></a-icosahedron>
        <a-icosahedron radius="0.6" position="4.6 0.4 -1.6" color="#3f5a35" material="flatShading: true; roughness: 1"></a-icosahedron>
        <a-icosahedron radius="0.4" position="-1.5 0.25 -1.3" color="#4a6b3a" material="flatShading: true; roughness: 1"></a-icosahedron>
        <a-icosahedron radius="0.45" position="1.6 0.28 -2.4" color="#3f5a35" material="flatShading: true; roughness: 1"></a-icosahedron>
        <a-entity position="-6.5 0 -9">
          <a-cylinder radius="0.18" height="2.6" position="0 1.3 0" color="#5c4a38"></a-cylinder>
          <a-icosahedron radius="1.7" position="0 3.4 0" color="#3d5a33" material="flatShading: true; roughness: 1"></a-icosahedron>
        </a-entity>
        <a-entity position="7 0 -10.5">
          <a-cylinder radius="0.22" height="3" position="0 1.5 0" color="#5c4a38"></a-cylinder>
          <a-icosahedron radius="2" position="0 3.9 0" color="#46643a" material="flatShading: true; roughness: 1"></a-icosahedron>
        </a-entity>
      </a-entity>

      <!-- ================================================================
           02 THE HALLWAY
           ================================================================ -->
      <a-entity id="scene-hallway" visible="false">
        <a-entity room-shell="width: 2.2; depth: 7.5; height: 2.7; wallColor: #d4ccc0; floorColor: #9a9080; ceilingColor: #cfc7bb; openings: front 0 0 1.0 2.1; frameMarks: 4"
                  position="0 0 -2.75"></a-entity>

        <!-- Warm light from the kitchen at the end of the hall -->
        <a-plane width="2" height="2.6" position="0 1.3 -6.7" material="shader: flat; color: #f0e0a0"></a-plane>
        <a-box width="0.08" height="2.15" depth="0.14" position="-0.54 1.075 -6.5" color="#a89c8a"></a-box>
        <a-box width="0.08" height="2.15" depth="0.14" position="0.54 1.075 -6.5" color="#a89c8a"></a-box>
        <a-box width="1.16" height="0.08" depth="0.14" position="0 2.14 -6.5" color="#a89c8a"></a-box>

        <!-- Lights: they turn golden when the memory unlocks -->
        <a-cylinder radius="0.006" height="0.45" position="0 2.475 -2.2" color="#333333"></a-cylinder>
        <a-cone radius-bottom="0.15" radius-top="0.04" height="0.12" position="0 2.24 -2.2" color="#e8e0d0" material="side: double"></a-cone>
        <a-sphere radius="0.05" position="0 2.17 -2.2" material="shader: flat; color: #fff2c8"></a-sphere>
        <a-entity class="reactive" light="type: point; color: #ffeccc; intensity: 1.6; distance: 9; decay: 1.2" position="0 2.0 -2.2"
                  memory-fx="property: light.color; to: #ffb65c; dur: 2000"
                  memory-fx__i="property: light.intensity; to: 2.8; dur: 2000"></a-entity>
        <a-entity light="type: point; color: #ffe9b0; intensity: 1; distance: 5; decay: 1.2" position="0 1.8 -6.0"></a-entity>
        <a-entity class="reactive" light="type: hemisphere; color: #d8d2c8; groundColor: #6a6258; intensity: 0.9"
                  memory-fx="property: light.color; to: #ffd9a0; dur: 2000"></a-entity>
        <a-entity drifting-motes="count: 90; size: 1.8 2.4 4; color: #ffe2a0; particleSize: 0.012; speed: 0.02; opacity: 0.6" position="0 0 -3"></a-entity>

        <!-- Coat rail with the cardigan (the trigger) -->
        <a-box width="0.04" height="0.08" depth="2.1" position="1.08 1.8 -2.6" color="#5c4033"></a-box>
        <a-box width="0.1" height="0.02" depth="0.02" position="1.03 1.76 -1.7" color="#3d2b1f"></a-box>
        <a-box width="0.1" height="0.02" depth="0.02" position="1.03 1.76 -2.15" color="#3d2b1f"></a-box>
        <a-box width="0.1" height="0.02" depth="0.02" position="1.03 1.76 -2.6" color="#3d2b1f"></a-box>
        <a-box width="0.1" height="0.02" depth="0.02" position="1.03 1.76 -3.05" color="#3d2b1f"></a-box>
        <a-box width="0.1" height="0.02" depth="0.02" position="1.03 1.76 -3.5" color="#3d2b1f"></a-box>

        <a-entity position="1.0 1.38 -2.6" rotation="0 -90 0" hold-to-activate="hitSize: 0.9 0.9 0.5; glowRadius: 0.45">
          <a-box width="0.46" height="0.64" depth="0.06" knit="color: #5a7a4a" roughness="1"></a-box>
          <a-box width="0.13" height="0.56" depth="0.05" position="-0.29 -0.02 0.005" rotation="0 0 6" knit="color: #56744a" roughness="1"></a-box>
          <a-box width="0.13" height="0.56" depth="0.05" position="0.29 -0.02 0.005" rotation="0 0 -6" knit="color: #56744a" roughness="1"></a-box>
          <a-box width="0.03" height="0.62" depth="0.065" color="#4a6a3c" roughness="1"></a-box>
          <a-sphere radius="0.012" position="0 0.2 0.035" color="#d8c8a0"></a-sphere>
          <a-sphere radius="0.012" position="0 0.07 0.035" color="#d8c8a0"></a-sphere>
          <a-sphere radius="0.012" position="0 -0.06 0.035" color="#d8c8a0"></a-sphere>
          <a-sphere radius="0.012" position="0 -0.19 0.035" color="#d8c8a0"></a-sphere>
          <a-box width="0.12" height="0.1" depth="0.01" position="-0.13 -0.17 0.035" knit="color: #4f6d42" roughness="1"></a-box>
        </a-entity>

        <!-- Memory: coats on every hook, shoes by the door, a figure with open arms -->
        <a-box class="reactive" visible="false" width="0.34" height="0.85" depth="0.08" position="1.055 1.33 -1.7" rotation="0 -90 0"
               color="#2f3e5c" material="transparent: true; opacity: 0"
               memory-fx="property: visible; to: true; delay: 200" memory-fx__o="property: material.opacity; to: 1; dur: 1200; delay: 200"></a-box>
        <a-box class="reactive" visible="false" width="0.32" height="0.8" depth="0.08" position="1.055 1.36 -2.15" rotation="0 -90 0"
               color="#b08850" material="transparent: true; opacity: 0"
               memory-fx="property: visible; to: true; delay: 500" memory-fx__o="property: material.opacity; to: 1; dur: 1200; delay: 500"></a-box>
        <a-box class="reactive" visible="false" width="0.34" height="0.9" depth="0.08" position="1.055 1.31 -3.05" rotation="0 -90 0"
               color="#7a2e2e" material="transparent: true; opacity: 0"
               memory-fx="property: visible; to: true; delay: 800" memory-fx__o="property: material.opacity; to: 1; dur: 1200; delay: 800"></a-box>
        <a-box class="reactive" visible="false" width="0.33" height="0.82" depth="0.08" position="1.055 1.35 -3.5" rotation="0 -90 0"
               color="#6d6d6d" material="transparent: true; opacity: 0"
               memory-fx="property: visible; to: true; delay: 1100" memory-fx__o="property: material.opacity; to: 1; dur: 1200; delay: 1100"></a-box>

        <a-entity class="reactive" visible="false" scale="0.01 0.01 0.01" position="0.55 0 -6.1"
                  memory-fx="property: visible; to: true; delay: 900"
                  memory-fx__s="property: scale; to: 1 1 1; dur: 900; delay: 900; easing: easeOutBack">
          <a-box width="0.12" height="0.09" depth="0.28" position="0 0.045 0" rotation="0 12 0" color="#3a2a20"></a-box>
          <a-box width="0.12" height="0.09" depth="0.28" position="0.14 0.045 0.03" rotation="0 -5 0" color="#3a2a20"></a-box>
          <a-box width="0.11" height="0.08" depth="0.26" position="-0.25 0.04 0.1" rotation="0 30 0" color="#8a2e2e"></a-box>
          <a-box width="0.11" height="0.08" depth="0.26" position="-0.12 0.04 0.18" rotation="0 60 0" color="#8a2e2e"></a-box>
          <a-box width="0.1" height="0.12" depth="0.24" position="0.05 0.13 0.05" rotation="15 40 10" color="#c9b89a"></a-box>
          <a-box width="0.09" height="0.07" depth="0.2" position="-0.4 0.035 -0.08" rotation="0 -20 0" color="#2f4a6a"></a-box>
        </a-entity>

        <a-entity class="reactive" memory-figure="pose: arms-open; clothes: #7fb069; glow: #ffe2b0; delay: 1200" position="0 0 -5.2"></a-entity>
      </a-entity>

      <!-- ================================================================
           03 THE KITCHEN
           ================================================================ -->
      <a-entity id="scene-kitchen" visible="false">
        <a-entity room-shell="width: 4.4; depth: 4.6; height: 2.7; wallColor: #e8dcc8; floorColor: #b0a090; ceilingColor: #efe6d6; floorStyle: tiles; openings: front 0 1.0 1.6 1.2"
                  position="0 0 -1.3"></a-entity>

        <!-- Lights -->
        <a-entity class="reactive" light="type: hemisphere; color: #fff4e2; groundColor: #9a8a78; intensity: 1.0"
                  memory-fx="property: light.color; to: #ffd9a0; dur: 2500"></a-entity>
        <a-entity class="reactive" light="type: point; color: #ffe8c4; intensity: 1.2; distance: 8; decay: 1.2" position="0 2.1 -1.3"
                  memory-fx="property: light.intensity; to: 1.7; dur: 2500"></a-entity>
        <a-entity class="reactive" light="type: directional; color: #dfeee6; intensity: 0.6" position="0 3 -6"
                  memory-fx="property: light.color; to: #ffc46a; dur: 2500"
                  memory-fx__i="property: light.intensity; to: 1.7; dur: 2500"></a-entity>

        <!-- Window with the garden beyond; it glows golden in the memory -->
        <a-entity position="0 1.6 -3.6">
          <a-box width="1.76" height="0.08" depth="0.16" position="0 0.64 0" color="#8b7355"></a-box>
          <a-box width="1.76" height="0.08" depth="0.16" position="0 -0.64 0" color="#8b7355"></a-box>
          <a-box width="0.08" height="1.36" depth="0.16" position="-0.84 0 0" color="#8b7355"></a-box>
          <a-box width="0.08" height="1.36" depth="0.16" position="0.84 0 0" color="#8b7355"></a-box>
          <a-box width="0.05" height="1.2" depth="0.08" color="#8b7355"></a-box>
          <a-box width="1.6" height="0.05" depth="0.08" color="#8b7355"></a-box>
          <a-box width="1.95" height="0.05" depth="0.28" position="0 -0.69 0.1" color="#c8bca6"></a-box>
        </a-entity>
        <a-plane class="reactive" width="7" height="4.5" position="0 1.6 -5.4" material="shader: flat"
                 sky-gradient="colors: #e4efe8, #c8e0d0, #a9c7a9, #6f9466"
                 memory-fx="property: material.color; to: #ffd88a; dur: 2500"></a-plane>
        <a-icosahedron radius="0.9" position="-1.3 0.8 -4.7" color="#4a6a3a" material="flatShading: true; roughness: 1"></a-icosahedron>
        <a-icosahedron radius="1" position="1.4 0.6 -5" color="#3f5f35" material="flatShading: true; roughness: 1"></a-icosahedron>
        <a-box class="reactive" visible="false" width="1.4" height="1" depth="3" position="0 1.05 -2.2" rotation="22 0 0"
               material="shader: flat; color: #ffd27a; transparent: true; opacity: 0; blending: additive; depthWrite: false; side: double"
               memory-fx="property: visible; to: true" memory-fx__o="property: material.opacity; to: 0.05; dur: 2500"></a-box>

        <!-- Table and two chairs -->
        <a-entity position="0 0 -1.6">
          <a-box width="1.3" height="0.05" depth="0.85" position="0 0.75 0" color="#7a6040" roughness="0.7"></a-box>
          <a-box width="0.05" height="0.73" depth="0.05" position="-0.58 0.365 -0.36" color="#6a5030"></a-box>
          <a-box width="0.05" height="0.73" depth="0.05" position="0.58 0.365 -0.36" color="#6a5030"></a-box>
          <a-box width="0.05" height="0.73" depth="0.05" position="-0.58 0.365 0.36" color="#6a5030"></a-box>
          <a-box width="0.05" height="0.73" depth="0.05" position="0.58 0.365 0.36" color="#6a5030"></a-box>
        </a-entity>
        <a-entity position="-0.95 0 -1.6">
          <a-box width="0.45" height="0.04" depth="0.45" position="0 0.46 0" color="#7a5a38"></a-box>
          <a-box width="0.04" height="0.5" depth="0.45" position="-0.2 0.73 0" color="#6a5030"></a-box>
          <a-box width="0.04" height="0.44" depth="0.04" position="-0.2 0.22 -0.2" color="#5c4028"></a-box>
          <a-box width="0.04" height="0.44" depth="0.04" position="0.2 0.22 -0.2" color="#5c4028"></a-box>
          <a-box width="0.04" height="0.44" depth="0.04" position="-0.2 0.22 0.2" color="#5c4028"></a-box>
          <a-box width="0.04" height="0.44" depth="0.04" position="0.2 0.22 0.2" color="#5c4028"></a-box>
        </a-entity>
        <a-entity position="0.95 0 -1.6" rotation="0 180 0">
          <a-box width="0.45" height="0.04" depth="0.45" position="0 0.46 0" color="#7a5a38"></a-box>
          <a-box width="0.04" height="0.5" depth="0.45" position="-0.2 0.73 0" color="#6a5030"></a-box>
          <a-box width="0.04" height="0.44" depth="0.04" position="-0.2 0.22 -0.2" color="#5c4028"></a-box>
          <a-box width="0.04" height="0.44" depth="0.04" position="0.2 0.22 -0.2" color="#5c4028"></a-box>
          <a-box width="0.04" height="0.44" depth="0.04" position="-0.2 0.22 0.2" color="#5c4028"></a-box>
          <a-box width="0.04" height="0.44" depth="0.04" position="0.2 0.22 0.2" color="#5c4028"></a-box>
        </a-entity>

        <!-- The teacup (the trigger): upside down, it turns over in the memory -->
        <a-entity position="0.15 0.775 -1.45">
          <a-cylinder radius="0.075" height="0.01" position="0 0.005 0" color="#e8d0b0" roughness="0.4"></a-cylinder>
          <a-entity class="reactive" position="0 0.042 0" rotation="180 0 0"
                    hold-to-activate="hitSize: 0.3 0.25 0.3; glowRadius: 0.16"
                    memory-fx="property: rotation; to: 0 0 0; dur: 1100; easing: easeInOutBack">
            <a-cone radius-bottom="0.03" radius-top="0.045" height="0.06" color="#e8d0b0" roughness="0.35"></a-cone>
            <a-torus radius="0.018" radius-tubular="0.005" position="0.05 0.005 0" color="#e8d0b0" roughness="0.35"></a-torus>
            <a-sphere radius="0.007" position="0 0.008 0.04" color="#c8a0b0"></a-sphere>
          </a-entity>
          <a-entity class="reactive" visible="false" position="0 0.08 0" memory-fx="property: visible; to: true; delay: 1400">
            <a-sphere radius="0.018" material="shader: flat; color: #ffffff; transparent: true; opacity: 0.35; depthWrite: false"
                      animation="property: position; from: 0 0 0; to: 0.02 0.22 0; dur: 2400; loop: true; easing: easeOutSine"
                      animation__fade="property: material.opacity; from: 0.35; to: 0; dur: 2400; loop: true; easing: easeInSine"></a-sphere>
            <a-sphere radius="0.015" material="shader: flat; color: #ffffff; transparent: true; opacity: 0.35; depthWrite: false"
                      animation="property: position; from: 0 0 0; to: -0.03 0.2 0.01; dur: 2400; delay: 800; loop: true; easing: easeOutSine"
                      animation__fade="property: material.opacity; from: 0.35; to: 0; dur: 2400; delay: 800; loop: true; easing: easeInSine"></a-sphere>
            <a-sphere radius="0.02" material="shader: flat; color: #ffffff; transparent: true; opacity: 0.3; depthWrite: false"
                      animation="property: position; from: 0 0 0; to: 0.01 0.24 -0.02; dur: 2400; delay: 1600; loop: true; easing: easeOutSine"
                      animation__fade="property: material.opacity; from: 0.3; to: 0; dur: 2400; delay: 1600; loop: true; easing: easeInSine"></a-sphere>
